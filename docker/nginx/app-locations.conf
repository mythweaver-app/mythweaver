# The app's routes, included by every front-door `server` (`docker/nginx.conf.template`, and
# `docker/nginx/tls.conf.template` under `compose.tls.yml`). Plain config, not a template: the image
# only substitutes `templates/`, so this names the `app` upstream instead of `${APP_UPSTREAM}`.

# The trailing slashes strip the prefix: xi sees `/<signature>/<processing>/…` (or
# `/info/<signature>/…`), the path the app signed (`Mythweaver.Attachments.Proxy.Xtandard`).
location /img/ {
  proxy_pass http://xi:8080/;
  proxy_http_version 1.1;

  proxy_cache xi;
  proxy_cache_key "$request_uri|$xi_format";
  # The key already covers what `Vary: Accept` would.
  proxy_ignore_headers Vary;
  # xi's own `Cache-Control` (XI_CACHE_HEADERS_TTL) governs freshness; these cover responses without one.
  proxy_cache_valid 200 1d;
  proxy_cache_valid 404 1m;
  # One resize per URL even when several tabs ask at once; serve the old copy if xi is down.
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

  add_header X-Cache-Status $upstream_cache_status always;
}

location / {
  proxy_pass http://app;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  # After realip (`docker/nginx.conf.template`) `$remote_addr` is the real client, so the app
  # always gets exactly one address, never one a client wrote itself.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # An idle socket between Phoenix's 30 s heartbeats must not be cut.
  proxy_read_timeout 1h;
}
