name: Build (main)
'on':
  push:
    branches:
    - main
    tags-ignore:
    - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    permissions:
      checks: write
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Install tools
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |-
          deps
          _build
          priv/localize
        key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'mise.lock') }}
        restore-keys: mix-${{ runner.os }}-
    - name: Fetch dependencies
      run: mix deps.get
    - name: Download locales
      run: mix localize.download_locales
    - name: Check and test
      run: mix ci
    - name: Publish test results
      if: '!cancelled()'
      uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
      with:
        comment_mode: 'off'
        files: test-results/**/*.xml
    services:
      postgres:
        env:
          POSTGRES_PASSWORD: postgres
        image: pgvector/pgvector:pg18-trixie
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
        - 5432:5432
  image-build:
    needs: test
    strategy:
      matrix:
        include:
        - platform: linux/amd64
          arch: amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          arch: arm64
          runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Log in to ghcr.io
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Image labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/mythweaver-app/mythweaver
    - name: Build image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: '.'
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=image-${{ matrix.arch }}
        outputs: type=image,name=ghcr.io/mythweaver-app/mythweaver,push-by-digest=true,name-canonical=true,push=true
        cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |-
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
  image-merge:
    needs: image-build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true
    - name: Log in to ghcr.io
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Image tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/mythweaver-app/mythweaver
        tags: |-
          type=edge,branch=main
          type=sha
    - name: Push the multi-arch image
      env:
        IMAGE: ghcr.io/mythweaver-app/mythweaver
      working-directory: ${{ runner.temp }}/digests
      shell: bash
      run: |-
        docker buildx imagetools create \
